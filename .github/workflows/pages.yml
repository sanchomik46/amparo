name: Publicar la web de Amparo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Reconstruir la web
        run: |
          mkdir -p _site
          cat site.part-* | base64 --decode | tar -xzf - -C _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar los archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
